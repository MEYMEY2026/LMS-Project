{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow border-0" style="border-radius: 20px;">
            <div class="card-body p-5">
                
                <div class="text-center mb-5">
                    <i class="bi bi-person-circle text-primary" style="font-size: 5rem;"></i>
                    <h3 class="fw-bold mt-3">{{ user.username }}</h3>
                    <span class="badge bg-primary">{{ user.profile.get_role_display }}</span>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    
                    <h5 class="mb-4 fw-bold text-secondary border-bottom pb-2">📝 ព័ត៌មានផ្ទាល់ខ្លួន</h5>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">នាមត្រកូល (Last Name)</label>
                            <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">នាមខ្លួន (First Name)</label>
                            <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">អ៊ីមែល (Email)</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email }}">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">ឈ្មោះអ្នកប្រើ (Username)</label>
                        <input type="text" class="form-control" value="{{ user.username }}" disabled>
                        <small class="text-muted">ឈ្មោះអ្នកប្រើមិនអាចកែប្រែបានទេ។</small>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg" style="border-radius: 12px;">💾 រក្សាទុកការកែប្រែ</button>
                    </div>
                </form>

                <hr class="my-5">

                <h5 class="mb-3 fw-bold text-secondary border-bottom pb-2">🔒 សុវត្ថិភាព</h5>
                <p class="text-muted">អ្នកអាចប្តូរលេខសម្ងាត់របស់អ្នកដើម្បីរក្សាសុវត្ថិភាពគណនី។</p>
                <a href="{% url 'change_password' %}" class="btn btn-outline-danger">ប្តូរលេខសម្ងាត់</a>

            </div>
        </div>
    </div>
</div>
{% endblock %}
