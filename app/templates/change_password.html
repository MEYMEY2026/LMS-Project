{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0" style="border-radius: 20px;">
            <div class="card-body p-5">
                <h4 class="text-center mb-4 fw-bold">🔒 ប្តូរលេខសម្ងាត់</h4>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        <input type="password" name="{{ field.name }}" class="form-control" required>
                        {% if field.help_text %}
                            <small class="text-muted">{{ field.help_text|safe }}</small>
                        {% endif %}
                        {% for error in field.errors %}
                            <div class="text-danger small">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger btn-lg" style="border-radius: 12px;">រក្សាទុកលេខសម្ងាត់ថ្មី</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{% url 'profile' %}" class="text-secondary">ត្រឡប់ក្រោយ</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
